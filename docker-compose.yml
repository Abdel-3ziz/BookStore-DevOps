services:

  postgres:
    image: postgres:16
    container_name: bookstore-postgres

    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: bookstore_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  backend:
    build: ./backend
    container_name: bookstore-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookstore
      DB_USER: bookstore_user
      DB_PASSWORD: bookstore_pass

    ports:
      - "8080:8080"

    depends_on:
      - postgres


  frontend:
    build: ./frontend
    container_name: bookstore-frontend

    environment:
      BACKEND_URL: http://backend:8080

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres-data: