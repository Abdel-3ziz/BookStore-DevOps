apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: bookstore
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: abdel3ziz/bookstore-backend:1.0
          ports:
          - containerPort: 8080
          env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: bookstore-config
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: bookstore-config
                key: DB_PORT 
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: bookstore-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: bookstore-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: bookstore-secret
                key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080