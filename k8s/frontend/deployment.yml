apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: bookstore
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: abdel3ziz/bookstore-frontend:1.1
          ports:
          - containerPort: 3000
          env:
          - name: BACKEND_URL
            valueFrom:
              configMapKeyRef:
                name: bookstore-config
                key: BACKEND_URL
